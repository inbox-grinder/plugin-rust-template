[package]
name = "rust-template"
version = "0.1.0"
edition = "2021"

# cdylib is needed for the WASM build; the binary target is listed separately.
[lib]
name = "rust_template"
crate-type = ["cdylib"]

[[bin]]
name = "plugin"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
